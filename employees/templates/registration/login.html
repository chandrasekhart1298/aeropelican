
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | AeroPeople</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f1f5f9;
            font-family: Arial, sans-serif;
            color: #1e293b;
        }

        .login-card {
            width: 90%;
            max-width: 400px;
            padding: 32px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin: 0 0 8px;
            color: #17365d;
            text-align: center;
        }

        .subtitle {
            margin-bottom: 28px;
            text-align: center;
            color: #64748b;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 7px;
            background: #2459a9;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #173f7a;
        }

        .error {
            color: #b91c1c;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
    <main class="login-card">
        <h1>AeroPeople</h1>
        <p class="subtitle">Sign in to your employee portal</p>

        {% if form.errors %}
            <p class="error">Invalid username or password. Please try again.</p>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <label for="id_username">Username</label>
            <input
                type="text"
                name="username"
                id="id_username"
                autocomplete="username"
                required
            >

            <label for="id_password">Password</label>
            <input
                type="password"
                name="password"
                id="id_password"
                autocomplete="current-password"
                required
            >

            <button type="submit">Sign In</button>
        </form>
    </main>
</body>
</html>
