<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in | AeroPeople</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f1f5f9;font:16px Segoe UI,Arial;color:#1e293b}.card{width:min(92%,420px);padding:34px;background:white;border-radius:16px;box-shadow:0 10px 40px #0f172a14}h1{text-align:center;color:#17365d;margin:0}.sub{text-align:center;color:#64748b;margin:8px 0 26px}label{display:block;font-weight:600;margin:14px 0 6px}input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:8px;font:inherit}button{margin-top:20px;width:100%;padding:12px;border:0;border-radius:8px;background:#2459a9;color:white;font:inherit;cursor:pointer}.error{color:#b91c1c}</style></head><body><main class="card"><h1>AeroPeople</h1><p class="sub">Sign in to your employee portal</p>{% if form.errors %}<p class="error">Invalid username or password. Please try again.</p>{% endif %}<form method="post">{% csrf_token %}<input type="hidden" name="next" value="{{ next }}"><label for="id_username">Username</label><input name="username" id="id_username" autocomplete="username" required autofocus><label for="id_password">Password</label><input type="password" name="password" id="id_password" autocomplete="current-password" required><button type="submit">Sign in</button></form></main></body></html>
